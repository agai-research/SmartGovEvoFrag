    runs: 5
    e1: {n_req: 200, xs: [0, 10, 25, 50, 75]}
    e2: {n_req: 300}
    e3: {n: 60, G: 15, xs: [0, 20, 40, 60, 80, 100], noise: 20, size: 5000}
    e4: {n: 60, xs: [3, 5, 8, 12, 18], ov: 0.6, noise: 20, size: 5000}
    e5: {n_req: 10000, xs: [100, 500, 1000, 5000, 10000], window: 100, trace: 100, n_tpl: 400}
    e6: {n: 20, xs: [3, 5, 8, 12, 18], noise: 10, size: 5000}
    e7: {n_req: 100, xs: [100, 500, 1000, 5000, 10000, 20000]}
    e8: {n: 100, xs: [10, 20, 40, 80, 160]}
    e9: {n: 120, buckets: [[3, 4], [5, 6], [7, 9], [10, 13], [14, 18]], size: 10000}
    e10: {n_req: 100, xs: [3, 5, 8, 12, 18], stale: 0.25}
    e11: {n_req: 300}
  smoke:
    runs: 1
    e1: {n_req: 30, xs: [0, 10, 25, 50, 75]}
    e2: {n_req: 40}
    e3: {n: 8, G: 15, xs: [0, 20, 40, 60, 80, 100], noise: 4, size: 5000}
    e4: {n: 8, xs: [3, 5, 8, 12, 18], ov: 0.6, noise: 4, size: 5000}
    e5: {n_req: 600, xs: [20, 60, 100, 300, 600], window: 20, trace: 20, n_tpl: 60}
    e6: {n: 4, xs: [3, 5, 8, 12, 18], noise: 2, size: 5000}
    e7: {n_req: 20, xs: [100, 200, 500, 1000, 2000]}
    e8: {n: 12, xs: [10, 20, 40, 80, 160]}
    e9: {n: 16, buckets: [[3, 4], [5, 6], [7, 9], [10, 13], [14, 18]], size: 10000}
    e10: {n_req: 20, xs: [3, 5, 8, 12, 18], stale: 0.25}
    e11: {n_req: 40}
